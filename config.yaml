# 项目配置
project:
  name: "AI测试自动化平台"
  version: "0.1.0"

# LLM配置
llm:
  # 推荐: qwen-coder-plus (通义千问编程版)
  # 备选: glm-4 (智谱GLM)
  model: "qwen-coder-plus"
  temperature: 0.7
  max_tokens: 4096

# 测试配置
testing:
  screenshot_on_failure: true
  video_on_failure: false
  retry_times: 2
  timeout: 30000

# 报告配置
reporting:
  allure_results_dir: "allure-results"
  screenshots_dir: "screenshots"
