[pytest]
asyncio_mode = auto
testpaths =
    tests/unit
    tests/integration
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short

markers =
    smoke: fast smoke tests that should run in CI
    regression: regression coverage
    slow: slow tests
    ui: tests that require Playwright/browser automation
    benchmark: stable benchmark/contract tests
